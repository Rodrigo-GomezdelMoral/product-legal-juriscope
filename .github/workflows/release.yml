name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (vX.Y.Z), for a rollback; empty deploys the tag the workflow runs on
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      sha: ${{ steps.digest.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: digest
        name: Digest that deploy.yml built for the tag's commit, and its load test unless only web, docs or workflows changed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a release tag: $TAG"; exit 1; }
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --commit "$sha" --status success --json databaseId --jq '.[0].databaseId')"
          test -n "$run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n "image-$sha" -D artifact
          digest="$(cat artifact/digest.txt)"
          echo "$TAG: deployed to staging by deploy.yml run $run"
          now="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)"
          earlier="[.[] | select(.tagName != \"$TAG\" and .publishedAt < \"$now\")] | sort_by(.publishedAt) | reverse | .[].tagName"
          previous=""
          for tag in $(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName,publishedAt --jq "$earlier"); do
            promoted="$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --branch "$tag" --status success --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$promoted" ]; then previous="$tag"; break; fi
          done
          needed=yes
          if [ -n "$previous" ]; then
            changed="$(git diff --name-only --no-renames "$previous" "$sha")"
            echo "Paths changed since $previous:"
            echo "${changed:-(none)}"
            needed=no
            while IFS= read -r path; do
              case "$path" in "" | web/* | docs/* | *.md | .github/*) ;; *) needed=yes ;; esac
            done <<< "$changed"
          else
            echo "No previous published release that release.yml promoted."
          fi
          if [ "$needed" = yes ]; then
            load="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" --jq '[.statuses[] | select(.context == "load-test")][0] | "\(.state) \(.description)"')"
            echo "Load test required: load-test $load"
            [[ "$load" == "success "*"$digest"* ]]
          else
            echo "Load test not required: every changed path is under web/, docs/ or .github/, or a Markdown file (ADR-015)."
          fi
          { echo "digest=$digest"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

  promote:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_TOKEN_CREDENTIALS: AzureCliCredential
      RG: rg-juriscope-prod-swc
      APP: ca-juriscope-prod
      PARAMS: infra/main.production.bicepparam
      IMAGE_DIGEST: ${{ needs.verify.outputs.digest }}
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      FOUNDRY_ACCOUNT_ENDPOINT: ${{ secrets.FOUNDRY_ACCOUNT_ENDPOINT }}
      SEARCH_ENDPOINT: ${{ secrets.SEARCH_ENDPOINT }}
      SEARCH_INDEX: jur-articles-prod
      CHAT_MODEL: ${{ vars.CHAT_MODEL }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      ALERT_EMAIL_ADDRESS: ${{ secrets.ALERT_EMAIL_ADDRESS }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if, then deploy the digest as revision v<major>-<minor>-<patch> behind the canary label
        run: |
          set -o pipefail
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          stable=""
          if az containerapp show -n "$APP" -g "$RG" -o none 2>/dev/null; then
            stable="$(az containerapp revision list -n "$APP" -g "$RG" --query "[?properties.trafficWeight > \`0\`].name | [0]" -o tsv)"
          fi
          suffix="$(tr '.' '-' <<< "$TAG")"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then suffix="$suffix-r$GITHUB_RUN_NUMBER"; fi
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then suffix="$suffix-a$GITHUB_RUN_ATTEMPT"; fi
          export STABLE_REVISION="$stable" REVISION_SUFFIX="$suffix"
          az deployment group what-if -g "$RG" -p "$PARAMS" --result-format ResourceIdOnly --only-show-errors \
            | sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/<guid>/g'
          out="$(az deployment group create -g "$RG" -n "juriscope-$suffix" -p "$PARAMS" --query properties.outputs -o json --only-show-errors)"
          fqdn="$(jq -r .fqdn.value <<< "$out")"
          echo "::add-mask::$fqdn"
          echo "::add-mask::${fqdn#*.}"
          {
            echo "STABLE_REVISION=$stable"; echo "FQDN=$fqdn"; echo "NEW=$(jq -r .revision.value <<< "$out")"
            echo "CORPUS_ACCOUNT_URL=$(jq -r .corpusAccountUrl.value <<< "$out")"; echo "STORAGE_ID=$(jq -r .storageId.value <<< "$out")"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --quiet -r requirements-dev.txt
      - name: Sign in again, since the federated token expires after minutes
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Corpus parts and the search index, a no-op when the PDF has not changed, retried while new roles propagate
        run: |
          for attempt in 1 2 3; do
            python -m ops.corpus --account-url "$CORPUS_ACCOUNT_URL" && python -m ops.index --target production --storage-id "$STORAGE_ID" && exit 0
            sleep 300
          done
          exit 1
      - name: Sign in again before the canary
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Health check and smoke test on the canary label, as the production CI principal
        run: |
          canary="$APP---canary.${FQDN#*.}"
          curl -fsS -o /dev/null --retry 18 --retry-delay 10 --retry-all-errors "https://$canary/healthz"
          token="$(az account get-access-token --resource "api://$AUTH_CLIENT_ID" --query accessToken -o tsv)"
          echo "::add-mask::$token"
          curl -fsS -o /dev/null -w "/api/meta %{http_code} %{time_total} s\n" -H "Authorization: Bearer $token" "https://$canary/api/meta"
      - name: Canary at 10 % for twelve minutes
        if: env.STABLE_REVISION != '' && env.STABLE_REVISION != env.NEW
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$NEW=10" "$STABLE_REVISION=90" -o none
          echo "CANARY_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          sleep 720
      - name: Sign in again, since the federated token expires after minutes
        if: env.STABLE_REVISION != '' && env.STABLE_REVISION != env.NEW
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: The canary's requests and 5xx from the Container Apps Requests metric, by revision
        if: env.STABLE_REVISION != '' && env.STABLE_REVISION != env.NEW
        run: |
          id="$(az containerapp show -n "$APP" -g "$RG" --query id -o tsv)"
          az monitor metrics list --resource "$id" --metric Requests --aggregation Total --interval PT1M -o json \
            --start-time "$CANARY_START" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --filter "revisionName eq '$NEW' and statusCodeCategory eq '*'" > requests.json
          counts="$(jq -er '[.value[0].timeseries[] | {n: ([.data[].total // 0] | add // 0),
              c: (.metadatavalues[] | select(.name.value | ascii_downcase == "statuscodecategory") | .value)}]
            | "\(map(.n) | add // 0) \(map(select(.c == "5xx") | .n) | add // 0)"' requests.json)"
          read -r total failed <<< "$counts"
          echo "canary: $total requests, $failed with 5xx; p95 per revision not measured (OPERATIONS.md)" | tee -a "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" 'BEGIN { exit !(t == 0) }'; then echo "The canary received no request: the 5xx rule did not apply." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          awk -v t="$total" -v f="$failed" 'BEGIN { exit !(f <= 0.01 * t) }'
      - name: Promote to 100 % and deactivate the previous revision
        if: env.STABLE_REVISION != '' && env.STABLE_REVISION != env.NEW
        run: |
          az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$NEW=100" "$STABLE_REVISION=0" -o none
          az containerapp revision deactivate -n "$APP" -g "$RG" --revision "$STABLE_REVISION" -o none
          echo "Promoted \`$IMAGE_DIGEST\` to production as \`${NEW##*--}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Roll back to the previous revision
        if: failure() && env.NEW != '' && env.STABLE_REVISION != '' && env.STABLE_REVISION != env.NEW
        run: |
          az containerapp revision activate -n "$APP" -g "$RG" --revision "$STABLE_REVISION" -o none
          az containerapp ingress traffic set -n "$APP" -g "$RG" --revision-weight "$STABLE_REVISION=100" "$NEW=0" -o none
          az containerapp revision deactivate -n "$APP" -g "$RG" --revision "$NEW" -o none
